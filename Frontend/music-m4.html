<!doctype html>
<!--
  Music page — M4 design (candidate replacement for m2.html; preview, not linked yet)

  Built from the M4 prototype (m4.html, left untouched as the reference):
  same layered album carousel, title badge, dock-sized glass playback bar,
  outline progress, Apple-style materials and spring motion.

  What it keeps from the current Music page (m2.html):
  - Top-left: the portfolio's global A / H / X control (AB2's markup, js/ab2/nav.js
    and css/m2-site-nav.css, all unmodified).
  - Top-centre: the Music tabs Songs | My Music | Radio — M2's own GooeyNav
    (js/music/gooey-nav.js, js/music/m2-nav.js, css/m2-nav.css, unmodified), re-skinned
    for M4 by this page's CSS (glass pill, neon gradient active pill, no white strip).
    Behaviour exactly as on m2.html: Songs = this page, My Music moves the marker and
    fires "m2:navchange", Radio opens Radio/radio.html.
  - Playback: the same YouTube playlist (PLMVMSl6aBQeo) through the official YouTube
    IFrame Player API, as M2 does: cued only, never autoplays; previous / next, seeking,
    volume and mute drive the YouTube player. As YouTube requires, the player is visible
    (upright, unclipped, at least 200 x 200 px, above the other layers) in the centre
    album slot. Carousel covers are the playlist's own YouTube thumbnails.
  - On file:// (YouTube refuses pages opened from disk) or if YouTube can't load, the
    page says so and plays the four CC-licensed tracks in assets/New folder/CassettePlayer/
    songs/ instead, so it still works locally.
  - js/shortcuts.js (M mute, F, Backspace) and js/background-music.js (pauses when this
    player starts) are loaded exactly as on m2.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music</title>
<meta name="description" content="Music — a layered album carousel with a glass playback bar.">
<link rel="icon" type="image/svg+xml" href="assets/music/m2/groove-mark.svg">
<link rel="stylesheet" href="css/m2-nav.css">
<link rel="stylesheet" href="css/m2-site-nav.css">
<style>
@font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: swap; src: url("assets/music/m2/fonts/inter-400.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 500 600; font-style: normal; font-display: swap; src: url("assets/music/m2/fonts/inter-600.woff2") format("woff2"); }

:root {
  /* Apple dark palette */
  --ground: #000;
  --label: rgba(255, 255, 255, 0.96);
  --label-2: rgba(235, 235, 245, 0.6);
  --label-3: rgba(235, 235, 245, 0.3);
  --fill: rgba(255, 255, 255, 0.1);
  --fill-2: rgba(255, 255, 255, 0.16);
  --separator: rgba(84, 84, 88, 0.55);
  --focus: #0a84ff;
  --tint: rgba(255, 79, 180, 0.5);           /* set from the selected album */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;

  /* motion: damped springs (ζ 0.72 and 0.9), sampled into linear() */
  --spring: linear(0.0, 0.0161, 0.0588, 0.1203, 0.1944, 0.2758, 0.3602, 0.4444, 0.5257, 0.6024, 0.6732, 0.7372, 0.7942, 0.8441, 0.8869, 0.923, 0.953, 0.9773, 0.9966, 1.0113, 1.0223, 1.0299, 1.0348, 1.0375, 1.0384, 1.0379, 1.0363, 1.034, 1.0312, 1.0281, 1.0249, 1.0216, 1.0185, 1.0155, 1);
  --spring-snappy: linear(0.0, 0.0103, 0.0378, 0.0777, 0.1264, 0.1808, 0.2385, 0.2976, 0.3566, 0.4143, 0.4698, 0.5227, 0.5725, 0.6189, 0.6619, 0.7013, 0.7373, 0.77, 0.7995, 0.8259, 0.8495, 0.8705, 0.8891, 0.9054, 0.9198, 0.9323, 0.9432, 0.9527, 0.9608, 0.9678, 0.9737, 0.9788, 0.9831, 0.9867, 1);

  /* sizes */
  --card: min(22vw, 34vh, 300px);
  --bar-w: 618px;          /* = homepage dock (index.html) at desktop size */
  --bar-h: 62px;
  --bar-bottom: 1.5rem;    /* same offset as the dock */
  --bar-space: calc(var(--bar-h) + var(--bar-bottom) + 24px);
  color-scheme: dark;
}
@supports not (transition-timing-function: linear(0, 1)) {
  :root { --spring: cubic-bezier(0.25, 1.25, 0.4, 1); --spring-snappy: cubic-bezier(0.2, 0.9, 0.25, 1); }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  background: var(--ground);
  color: var(--label);
  font-family: var(--font);
  font-size: 15px;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---------- ambient: the selected artwork, heavily blurred, slowly drifting ---------- */
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.ambient img {
  /* drawn small and scaled up: the same soft look as a huge blur, at a fraction of the cost */
  position: absolute; left: 50%; top: 42%; width: max(30vw, 30vh); aspect-ratio: 1; max-width: none;
  translate: -50% -50%;
  transform: scale(3.7);
  filter: blur(24px) saturate(1.7);
  opacity: 0; transition: opacity 1.4s ease;
  animation: drift 48s linear infinite;
}
.ambient img.is-on { opacity: 0.42; }
.ambient::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 70%, #000 100%); }
@keyframes drift { from { rotate: 0deg; scale: 1; } 50% { scale: 1.12; } to { rotate: 360deg; scale: 1; } }

.player {
  position: relative; z-index: 1;
  min-height: 100%;
  overflow-x: clip;
  display: grid; align-content: center; justify-items: center;
  gap: clamp(14px, 2.2vh, 22px);
  padding-top: clamp(24px, 5vh, 64px);
  padding-bottom: calc(var(--bar-space) + env(safe-area-inset-bottom, 0px));
}

/* ---------- materials ---------- */
.glass {
  background: rgba(44, 44, 50, 0.48);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  backdrop-filter: blur(40px) saturate(180%);
  box-shadow:
    inset 0 0.5px 0 rgba(255, 255, 255, 0.3),
    inset 0 0 0 0.5px rgba(255, 255, 255, 0.1),
    0 24px 48px -18px rgba(0, 0, 0, 0.7),
    0 8px 18px -10px rgba(0, 0, 0, 0.45);
}
.rim { position: relative; }
.rim::before { /* specular edge: bright top-left, album tint bottom-right */
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.42), rgba(255,255,255,.04) 32%, rgba(255,255,255,.02) 66%, var(--tint));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  transition: background 0.8s ease;
}

/* ---------- carousel (positions are driven by a spring in JS) ---------- */
.m4-stage {
  position: relative; width: 100%; max-width: 1200px;
  height: calc(var(--card) * 1.04);
  perspective: 1400px; perspective-origin: 50% 45%;
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.m4-stage:focus-visible { outline-offset: 10px; border-radius: 24px; }
.track { position: absolute; inset: 0; transform-style: preserve-3d; }
.card {
  position: absolute; left: 50%; top: 0;
  width: var(--card); aspect-ratio: 1; max-width: 100%;
  margin-left: calc(var(--card) / -2);
  border-radius: calc(var(--card) * 0.07);
  box-shadow: 0 34px 60px -26px rgba(0,0,0,.9), 0 0 54px -14px var(--tint, transparent);
  cursor: pointer;
  will-change: transform, filter;
  backface-visibility: hidden;
}
.card img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; display: block; pointer-events: none; }
.card .sheen {
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background:
    radial-gradient(circle at var(--gx, 30%) var(--gy, 15%), rgba(255,255,255, calc(0.34 * var(--hover, 0))), rgba(255,255,255,0) 55%),
    linear-gradient(155deg, rgba(255,255,255,.2) 0%, rgba(255,255,255,.04) 24%, rgba(255,255,255,0) 42%);
  box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.3), inset 0 1px 0 rgba(255,255,255,.32);
}
.m4-stage.is-dragging, .m4-stage.is-dragging .card { cursor: grabbing; }

/* ---------- title badge ---------- */
/* song title under the player: plain text on the background, no card (2026-10-27) */
.badge {
  min-width: min(180px, 100%); max-width: min(320px, 100%);
  padding: 8px 22px 9px; text-align: center; overflow: hidden;
  background: none; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none;
  position: relative; z-index: 1;   /* stays above the player's and covers' soft drop shadows, as the card did */
}
#badgeText h1 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: -0.016em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#badgeText p { margin: 0; font-size: 13px; line-height: 18px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#badgeText .tag { color: var(--label-3); }

/* ---------- playback bar: fixed to the bottom centre like the dock ---------- */
.bar {
  position: fixed; z-index: 40;
  left: 50%; bottom: calc(var(--bar-bottom) + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: min(var(--bar-w), calc(100vw - 32px));
  height: var(--bar-h);
  display: flex; align-items: center; gap: 6px;
  padding: 0 12px 0 14px;
  border-radius: 999px;
}
.ibtn {
  position: relative; flex: none; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; color: rgba(255,255,255,.9);
  transition: transform 0.5s var(--spring), background-color 0.2s ease, color 0.2s ease;
}
.ibtn:hover { background: var(--fill); color: #fff; }
.ibtn:active { transform: scale(0.84); transition-duration: 0.09s, 0.2s, 0.2s; }
.ibtn svg { width: 19px; height: 19px; fill: currentColor; }
.ibtn[aria-expanded="true"], .ibtn[aria-pressed="true"] { background: var(--fill-2); color: #fff; }
.transport, .tools { display: flex; align-items: center; }

/* symbol replace: outgoing symbol shrinks and blurs out, incoming one springs in */
.sym { position: absolute; inset: 0; margin: auto; transition: transform 0.5s var(--spring), opacity 0.22s ease, filter 0.22s ease; }
.sym.off { transform: scale(0.35); opacity: 0; filter: blur(3px); }

.now {
  flex: 1 1 auto; min-width: 0; position: relative;
  display: flex; align-items: center; gap: 9px;
  height: calc(var(--bar-h) - 14px);
  padding: 0 6px 0 5px; border-radius: 13px;
  background: rgba(0, 0, 0, 0.24);
  box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.06), inset 0 1px 2px rgba(0,0,0,.25);
}
.thumb { flex: none; height: calc(100% - 10px); aspect-ratio: 1; border-radius: 7px; overflow: hidden; box-shadow: 0 4px 10px -4px rgba(0,0,0,.7), inset 0 0 0 .5px rgba(255,255,255,.2); }
.thumb img { width: 100%; height: 100%; display: block; }
.meta { min-width: 0; flex: 1; }
.meta strong { display: block; font-weight: 500; font-size: 13px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta span { display: block; font-size: 11.5px; line-height: 15px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time { flex: none; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--label-2); letter-spacing: 0; }
.now .ibtn { width: 26px; height: 26px; }
.now .ibtn svg { width: 16px; height: 16px; }

/* now-playing bars */
.eq { flex: none; display: flex; align-items: flex-end; gap: 2px; height: 11px; }
.eq i { width: 2.5px; height: 100%; border-radius: 2px; background: currentColor; color: var(--label-2); transform-origin: bottom; transform: scaleY(0.28); transition: transform 0.4s var(--spring), color 0.3s; }
.is-playing .eq i { color: #fff; animation: eq 0.9s ease-in-out infinite alternate; }
.is-playing .eq i:nth-child(2) { animation-duration: 0.66s; animation-delay: -0.3s; }
.is-playing .eq i:nth-child(3) { animation-duration: 0.78s; animation-delay: -0.5s; }
.is-playing .eq i:nth-child(4) { animation-duration: 0.58s; animation-delay: -0.1s; }
@keyframes eq { 0% { transform: scaleY(0.25); } 100% { transform: scaleY(1); } }

/* progress: a light that travels clockwise around the bar's outline, starting at the top centre.
   The edge itself is the seek control (drag or click along it); keyboard users get the
   visually hidden slider below, which lights the outline blue while focused. */
.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 2; }
.ring-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; touch-action: none; }
.ring-fill {
  fill: none; stroke: rgba(255, 255, 255, 0.95); stroke-width: 2; stroke-linecap: round;
  filter: drop-shadow(0 0 3px var(--tint)) drop-shadow(0 0 1px rgba(255,255,255,.6));
  transition: stroke-width 0.45s var(--spring), stroke 0.2s ease, opacity 0.3s ease;
}
.ring-hit:hover ~ .ring-fill, .ring.is-active .ring-fill { stroke-width: 3.5; }
.ring.is-empty .ring-fill { opacity: 0; }
.ring.is-disabled .ring-hit { cursor: default; }
.bar:has(.scrub:focus-visible) .ring-fill { stroke: var(--focus); stroke-width: 3.5; opacity: 1; }
.scrub { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.scrub-fill { width: 100%; height: 100%; transform-origin: left; transform: scaleX(var(--p, 0)); }

/* ---------- popovers (glass menus) ---------- */
.pop {
  position: absolute; right: 0; bottom: calc(100% + 12px); z-index: 10;
  min-width: 240px; max-width: min(300px, calc(100vw - 32px));
  padding: 6px; border-radius: 16px;
  background: rgba(40, 40, 46, 0.62);
  transform-origin: calc(100% - 24px) 100%;
}
.pop h2 { margin: 6px 10px 6px; font-size: 13px; font-weight: 600; color: var(--label-2); letter-spacing: -0.005em; }
.pop ol { list-style: none; margin: 0; padding: 0; }
.row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; text-align: left; transition: background-color .15s; }
.row:hover { background: var(--fill); }
.row img { width: 40px; height: 40px; border-radius: 6px; flex: none; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.2); }
.row .txt { min-width: 0; flex: 1; }
.row b { display: block; font-weight: 500; font-size: 14px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row small { display: block; color: var(--label-2); font-size: 12px; line-height: 16px; }
.row .eq { margin-right: 4px; visibility: hidden; }
.row[aria-current="true"] .eq { visibility: visible; }
.mrow { width: 100%; display: grid; grid-template-columns: 20px 1fr 20px; align-items: center; gap: 6px; padding: 8px 10px 8px 6px; border-radius: 10px; font-size: 15px; text-align: left; transition: background-color .15s; }
.mrow:hover { background: var(--focus); }
.mrow svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.mrow .mcheck { opacity: 0; transition: opacity .2s; }
.mrow[aria-checked="true"] .mcheck { opacity: 1; }
.sep { height: 0.5px; margin: 5px 10px; background: var(--separator); }
.info { padding: 12px; }
.info .head { display: flex; gap: 12px; align-items: center; }
.info .head img { width: 56px; height: 56px; border-radius: 8px; flex: none; }
.info .head b { display: block; font-size: 15px; font-weight: 600; }
.info .head small { display: block; color: var(--label-2); font-size: 13px; }
.info p { margin: 12px 0 0; font-size: 13px; line-height: 1.45; color: var(--label-2); }
.info a { color: var(--focus); text-decoration: none; }
.info a:hover { text-decoration: underline; }

/* Control-Center-style volume slider */
.vol { display: flex; align-items: center; gap: 10px; padding: 8px 6px 6px; }
.vol .ibtn { width: 28px; height: 28px; }
.vol .ibtn svg { width: 16px; height: 16px; }
.vslider { flex: 1; height: 26px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
.vslider .scrub-track { width: 100%; overflow: hidden; transition: height 0.45s var(--spring); height: 8px; border-radius: 8px; background: rgba(255,255,255,.16); }
.vslider.is-active .scrub-track, .vslider:hover .scrub-track { height: 12px; }
.vslider .scrub-fill { background: #fff; }
.vslider:focus-visible { outline-offset: 2px; border-radius: 8px; }
.vol-end { color: var(--label-2); flex: none; display: grid; place-items: center; }
.vol-end svg { width: 18px; height: 18px; fill: currentColor; }

.toast {
  position: fixed; left: 50%; z-index: 50;
  bottom: calc(var(--bar-space) + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap;
}

/* ---------- breakpoints (bar follows the dock's sizes) ---------- */
@media (max-width: 900px) {
  :root { --bar-w: 518px; --bar-h: 52px; --bar-bottom: 1.25rem; }
  .ibtn { width: 28px; height: 28px; }
  .ibtn svg { width: 17px; height: 17px; }
  .meta strong { font-size: 12px; }
  .meta span { font-size: 11px; }
  .time { font-size: 11px; }
}
@media (max-width: 760px) {
  :root { --card: min(50vw, 32vh, 230px); }
}
/* phones: the dock is too small for tappable controls on one row, so the bar keeps
   the dock's 396px width and splits into two rows */
@media (max-width: 640px) {
  :root { --bar-w: 396px; --bar-h: 58px; --bar-bottom: 1rem; --bar-space: 130px; }
  .bar { height: auto; flex-wrap: wrap; border-radius: 24px; padding: 7px 10px 6px; gap: 2px 0; justify-content: space-between; }
  .now { order: -1; flex-basis: 100%; }
  .ibtn { width: 36px; height: 36px; }
  .ibtn svg { width: 19px; height: 19px; }
  .now .ibtn { width: 30px; height: 30px; }
  .pop { left: 0; right: 0; max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  .ambient img { animation: none; }
  .is-playing .eq i { animation: none; transform: scaleY(0.7); }
  .ibtn, .sym, .scrub-track, .ring-fill { transition-duration: 0.01ms !important; }
}

/* =====================================================================
   Music page additions
   ===================================================================== */
:root { --top-space: 104px; }
@media (min-width: 1101px) and (min-height: 521px),
       (min-width: 900px) and (min-height: 521px) and (orientation: landscape) {
  :root { --top-space: 116px; }
}
.player { padding-top: calc(var(--top-space) + env(safe-area-inset-top, 0px)); }

/* top bar: M2's own navigation (css/m2-nav.css, css/m2-site-nav.css, js/music/gooey-nav.js,
   js/music/m2-nav.js, js/ab2/nav.js — all unmodified, so m2.html keeps its look).
   Everything below re-skins it for M4 from this page only: no strip, a glass pill for
   the tabs, a neon gradient active pill, neon particles, white A, glass menu. */
.mus-topbar {
  background: transparent;
  --m2-nav-text: rgba(235, 235, 245, 0.7);
  --m2-nav-on-pill: #ffffff;
  --m2-nav-pill: transparent;
  --color-1: #ff4fb4;   /* GooeyNav particles: pink, violet, cyan, blue */
  --color-2: #9a6bff;
  --color-3: #54e1ff;
  --color-4: #3d7bff;
}
.mus-topbar > .ab2-nav { --ab2-ink: #ffffff; --ab2-red: #ff6ec4; --ab2-paper: rgba(24, 20, 34, 0.72); }
.mus-topbar > .ab2-nav .ab2-nav__glyph { filter: drop-shadow(0 0 10px rgba(154, 107, 255, 0.45)); }
/* A menu: text only, no panel behind it */
.mus-topbar > .ab2-nav .ab2-nav__menu {
  margin-top: 6px;
  background: transparent; border: 0; box-shadow: none;
  -webkit-backdrop-filter: none; backdrop-filter: none;
}
/* keeps the floating links readable over bright album art */
.mus-topbar > .ab2-nav .ab2-nav__item { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6), 0 0 14px rgba(0, 0, 0, 0.5); }

/* tabs: plain floating text — no bar, no pill, no glow. Active tab = white semibold text. */
.mus-topbar > #musicNav { padding: 4px; }   /* padding kept so the labels stay exactly where they were */
.mus-topbar > #musicNav nav ul { gap: 2px; padding: 0; text-shadow: none; }
.mus-topbar > #musicNav nav ul li a { padding: 0.5em 1.15em; font-size: 14px; font-weight: 500; letter-spacing: -0.005em; }
.mus-topbar > #musicNav nav ul li { color: rgba(235, 235, 245, 0.6); }
.mus-topbar > #musicNav nav ul li:not(.active):hover { color: #fff; }
.mus-topbar > #musicNav nav ul li.active { color: #fff; }
.mus-topbar > #musicNav nav ul li.active a { font-weight: 600; }
/* the GooeyNav's pill layers (css/m2-nav.css): resting pill, switching pill + particles, and
   the duplicate active label drawn over the pill — none of them are wanted here */
.mus-topbar > #musicNav nav ul li::after { content: none; }
.mus-topbar > #musicNav .effect { display: none; }
@media (max-width: 480px) {
  .mus-topbar > #musicNav nav ul li a { padding: 0.5em 0.8em; font-size: 13px; }
}
@media (max-width: 339px) {
  .mus-topbar > #musicNav nav ul li a { padding: 0.5em 0.55em; font-size: 12px; }
}
/* Layering: ambient below everything, the carousel in its own z 0 layer, the top bar
   (tabs and the A / H / X menu) above the carousel. */
.mus-topbar { z-index: 60; }
.ambient { z-index: -1; }
.player { z-index: auto; }
.m4-stage { z-index: 0; }

/* YouTube player in the centre album slot */
.yt-frame {
  position: absolute; left: 50%; top: 0; z-index: 300;
  width: max(var(--card), 216px); aspect-ratio: 1; max-width: calc(100vw - 32px);
  translate: -50% 0;
  padding: 8px; border-radius: calc(max(var(--card), 216px) * 0.07);
  background: #000;
  box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.22), inset 0 1px 0 rgba(255,255,255,.28), 0 34px 60px -26px rgba(0,0,0,.9), 0 0 54px -14px var(--tint);
}
.yt-frame iframe, .yt-frame > div { display: block; width: 100%; height: 100%; border: 0; }
body.is-yt .card { cursor: grab; }
/* the YouTube player must stay at least 200 x 200 px: never let the album slot get smaller */
body.is-yt { --card: max(216px, min(22vw, 34vh, 300px)); }
@media (max-width: 760px) { body.is-yt { --card: max(216px, min(50vw, 32vh, 230px)); } }

/* engine notice under the badge */
.source-note { margin: -4px 0 0; font-size: 12px; color: var(--label-3); text-align: center; max-width: 40ch; }

/* covers from YouTube: hqdefault is 4:3 with letterbox bars; crop to the picture */
.card img.yt-cover, .row img.yt-cover, .thumb img.yt-cover, .info .head img.yt-cover { object-fit: cover; }
.card img.yt-cover { transform: scale(1.34); }
.card { overflow: hidden; }
.card .sheen { z-index: 1; }
.thumb img.yt-cover, .row img.yt-cover, .info .head img.yt-cover { transform: scale(1.34); }
.row img, .info .head img { overflow: hidden; }
.row .art, .info .head .art { flex: none; overflow: hidden; border-radius: 6px; }
.row .art { width: 40px; height: 40px; }
.info .head .art { width: 56px; height: 56px; border-radius: 8px; }
.row .art img, .info .head .art img { width: 100%; height: 100%; display: block; border-radius: 0; }
#queueList { max-height: min(50vh, 360px); overflow-y: auto; }
</style>
</head>

    var t = p * ctl.dur, sc = $("scrub");
    sc.setAttribute("aria-valuenow", String(Math.round(t)));
    sc.setAttribute("aria-valuetext", fmt(t));
  }
  function scrubInput(f) { ctl.scrubbing = true; setProgress(f); if (ctl.dur) $("time").textContent = fmt(f * ctl.dur); }
  function scrubCommit(f) { if (f !== null && ctl.dur) ctl.engine.seek(f * ctl.dur); ctl.scrubbing = false; }
  function layoutRing() {
    var w = bar.clientWidth, h = bar.clientHeight;
    if (!w || !h) return;
    var r = Math.min(parseFloat(getComputedStyle(bar).borderTopLeftRadius) || h / 2, h / 2, w / 2);
    var o = 1, ri = Math.max(0, r - o);
    var d = "M" + (w / 2) + " " + o +
      " H" + (w - r) + " A" + ri + " " + ri + " 0 0 1 " + (w - o) + " " + r +
      " V" + (h - r) + " A" + ri + " " + ri + " 0 0 1 " + (w - r) + " " + (h - o) +
      " H" + r + " A" + ri + " " + ri + " 0 0 1 " + o + " " + (h - r) +
      " V" + r + " A" + ri + " " + ri + " 0 0 1 " + r + " " + o + " Z";
    ring.setAttribute("viewBox", "0 0 " + w + " " + h);
    ringHit.setAttribute("d", d); ringFill.setAttribute("d", d);
    var L = ringHit.getTotalLength(), n = 480;
    ringPts = [];
    for (var i = 0; i <= n; i++) { var pt = ringHit.getPointAtLength(L * i / n); ringPts.push([pt.x, pt.y]); }
  }
  function ringFrac(e) {
    var r = bar.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, best = 0, bd = Infinity;
    for (var i = 0; i < ringPts.length; i++) {
      var dx = ringPts[i][0] - x, dy = ringPts[i][1] - y, dd = dx * dx + dy * dy;
      if (dd < bd) { bd = dd; best = i; }
    }
    return best / (ringPts.length - 1);
  }
  var ringDrag = false;
  ringHit.addEventListener("pointerdown", function (e) {
    if (ring.classList.contains("is-disabled") || e.button !== 0) return;
    ringDrag = true; ring.classList.add("is-active");
    try { ringHit.setPointerCapture(e.pointerId); } catch (err) {}
    scrubInput(ringFrac(e)); e.preventDefault(); e.stopPropagation();
  });
  ringHit.addEventListener("pointermove", function (e) { if (ringDrag) scrubInput(ringFrac(e)); });
  ringHit.addEventListener("pointerup", function (e) { if (!ringDrag) return; ringDrag = false; ring.classList.remove("is-active"); scrubCommit(ringFrac(e)); });
  ringHit.addEventListener("pointercancel", function () { if (!ringDrag) return; ringDrag = false; ring.classList.remove("is-active"); scrubCommit(null); });
  ringHit.addEventListener("click", function (e) { e.stopPropagation(); });
  if (window.ResizeObserver) new ResizeObserver(layoutRing).observe(bar); else window.addEventListener("resize", layoutRing);
  layoutRing();
  $("scrub").addEventListener("keydown", function (e) {
    if (!ctl.dur || $("scrub").getAttribute("aria-disabled") === "true") return;
    var t = ctl.engine.time;
    if (e.key === "ArrowRight") t += 5; else if (e.key === "ArrowLeft") t -= 5;
    else if (e.key === "Home") t = 0; else if (e.key === "End") t = ctl.dur - 0.5; else return;
    e.preventDefault(); ctl.engine.seek(Math.max(0, Math.min(ctl.dur, t)));
  });

  // ---------- volume (shared mute switch with the M key and the background-music button) ----------
  var SPK = '<path d="M5 12.5h4.2L15 7.4c.6-.5 1.5-.1 1.5.7v15.8c0 .8-.9 1.2-1.5.7l-5.8-5.1H5c-.6 0-1-.4-1-1v-5c0-.6.4-1 1-1Z"/>';
  var VOL = {
    hi: SPK + '<path d="M20 11.2a6.5 6.5 0 0 1 0 9.6M23.2 8a11 11 0 0 1 0 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
    lo: SPK + '<path d="M20 11.2a6.5 6.5 0 0 1 0 9.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
    off: SPK + '<path d="M20.5 12.5l7 7m0-7l-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>'
  };
  function refreshVolume() {
    var v = ctl.vol, m = ctl.engine ? ctl.engine.muted : false;
    $("volFill").style.setProperty("--p", (m ? 0 : v).toFixed(3));
    $("vslider").setAttribute("aria-valuenow", String(Math.round(v * 100)));
    var icon = m || v === 0 ? VOL.off : v < 0.5 ? VOL.lo : VOL.hi;
    if ($("volIcon").innerHTML !== icon) $("volIcon").innerHTML = icon;
    $("muteIcon").innerHTML = m ? VOL.off : SPK;
    $("muteBtn").setAttribute("aria-pressed", String(m));
    $("muteBtn").setAttribute("aria-label", m ? "Unmute" : "Mute");
  }
  function setVolume(v) { ctl.vol = Math.max(0, Math.min(1, v)); if (ctl.engine) ctl.engine.setVolume(ctl.vol); refreshVolume(); }
  function toggleMute() {
    if (window.PortfolioShortcuts && window.PortfolioShortcuts.toggleMute) window.PortfolioShortcuts.toggleMute();   // the site-wide switch (M key)
    else if (ctl.engine) ctl.engine.setMuted(!ctl.engine.muted);
    refreshVolume();
  }
  function slider(el, onInput, onCommit) {
    var active = false;
    function frac(e) { var r = el.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); }
    el.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      active = true; el.classList.add("is-active");
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      onInput(frac(e)); e.preventDefault();
    });
    el.addEventListener("pointermove", function (e) { if (active) onInput(frac(e)); });
    el.addEventListener("pointerup", function (e) { if (!active) return; active = false; el.classList.remove("is-active"); onCommit(frac(e)); });
    el.addEventListener("pointercancel", function () { if (!active) return; active = false; el.classList.remove("is-active"); onCommit(null); });
  }
  slider($("vslider"), function (f) { if (ctl.engine && ctl.engine.muted) toggleMute(); setVolume(f); }, function () {});
  $("vslider").addEventListener("keydown", function (e) {
    var d = e.key === "ArrowRight" || e.key === "ArrowUp" ? 0.05 : e.key === "ArrowLeft" || e.key === "ArrowDown" ? -0.05 : 0;
    if (!d) return; e.preventDefault(); setVolume(ctl.vol + d);
  });
  $("muteBtn").addEventListener("click", toggleMute);
  // js/shortcuts.js calls setMuted() on every <groove-turntable>; forward it to whichever engine is active.
  $("muteBridge").setMuted = function (m) { if (ctl.engine) ctl.engine.setMuted(m); refreshVolume(); };
  function storedMute() { try { return window.sessionStorage.getItem("portfolio:muted") === "1"; } catch (err) { return false; } }

  // ---------- popovers ----------
  var pops = [["queueBtn", "queuePop"], ["volBtn", "volPop"], ["infoBtn", "infoPop"], ["moreBtn", "morePop"]];
  var openPop = null;
  function showPop(btnId, popId) {
    var pop = $(popId), btn = $(btnId);
    pop.hidden = false;
    var pr = pop.getBoundingClientRect(), br = btn.getBoundingClientRect();
    pop.style.transformOrigin = (br.left + br.width / 2 - pr.left).toFixed(0) + "px 100%";
    btn.setAttribute("aria-expanded", "true");
    pop.getAnimations().forEach(function (a) { a.cancel(); });
    anim(pop, [{ opacity: 0, transform: "scale(.82) translateY(10px)", filter: "blur(8px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }], { duration: 520, easing: SPRING });
    openPop = [btnId, popId];
    if (popId === "queuePop") { var cur = pop.querySelector('[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: "nearest" }); }
  }
  function hidePop(p) {
    var pop = $(p[1]);
    $(p[0]).setAttribute("aria-expanded", "false");
    var a = anim(pop, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(.94)" }], { duration: 140, easing: "ease-in" });
    if (a) a.onfinish = function () { if (!openPop || openPop[1] !== p[1]) pop.hidden = true; }; else pop.hidden = true;
  }
  function closePops() { if (openPop) { var p = openPop; openPop = null; hidePop(p); } }
  pops.forEach(function (p) {
    $(p[0]).addEventListener("click", function (e) {
      e.stopPropagation();
      var wasOpen = openPop && openPop[1] === p[1];
      closePops();
      if (!wasOpen) showPop(p[0], p[1]);
    });
    $(p[1]).addEventListener("click", function (e) { e.stopPropagation(); });
  });
  document.addEventListener("click", closePops);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && openPop) { var b = openPop[0]; closePops(); $(b).focus(); } });

  function renderQueue() {
    $("queueList").innerHTML = items.map(function (it, i) {
      return '<li><button class="row" type="button" data-i="' + i + '" aria-current="' + (i === ctl.current) + '">' +
        '<span class="art">' + imgTag(it) + '</span><span class="txt"><b>' + esc(it.title || "Track " + (i + 1)) + "</b><small>" + esc(it.artist || (it.yt ? "YouTube" : "")) + "</small></span>" +
        '<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button></li>';
    }).join("");
  }
  $("queueList").addEventListener("click", function (e) {
    var b = e.target.closest("[data-i]"); if (!b) return;
    var i = +b.dataset.i;
    ctl.activate(i);
    goTo(nearest(i), true);
    closePops();
  });
  function renderInfo() {
    var it = items[ctl.current]; if (!it) return;
    var body = '<div class="head"><span class="art">' + imgTag(it) + '</span><span><b>' + esc(it.title || "Loading…") + "</b><small>" + esc(it.artist || "YouTube") + (it.album && !it.yt ? " · " + esc(it.album) : "") + "</small></span></div>";
    if (it.yt) body += '<p>Playing from YouTube. <a href="https://www.youtube.com/watch?v=' + encodeURIComponent(it.id) + '&amp;list=' + PLAYLIST_ID + '" target="_blank" rel="noopener">Watch on YouTube</a></p>';
    else body += '<p>Licensed under <a href="' + it.license.url + '" target="_blank" rel="noopener license">' + it.license.name + '</a>. <a href="' + it.source + '" target="_blank" rel="noopener">Artist page</a></p>';
    body += "<p>No lyrics are available for this track.</p>";
    $("infoBody").innerHTML = body;
  }
  function toggleRow(row, key) {
    ctl[key] = !ctl[key];
    row.setAttribute("aria-checked", String(ctl[key]));
    toast((key === "shuffle" ? "Shuffle " : "Repeat ") + (ctl[key] ? "On" : "Off"));
    closePops();
  }
  $("shuffleRow").addEventListener("click", function () { toggleRow(this, "shuffle"); });
  $("repeatRow").addEventListener("click", function () { toggleRow(this, "repeat"); });

  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("play", function () { ctl.play(); });
      navigator.mediaSession.setActionHandler("pause", function () { if (ctl.engine) ctl.engine.pause(); });
      navigator.mediaSession.setActionHandler("previoustrack", function () { ctl.step(-1); });
      navigator.mediaSession.setActionHandler("nexttrack", function () { ctl.step(1); });
    } catch (err) {}
  }

  // ---------- start ----------
  function useEngine(engine) {
    ctl.engine = engine; ctl.mode = engine.mode;
    document.body.classList.toggle("is-yt", engine.mode === "yt");
    items = engine.items; N = items.length; sel = 0; ctl.current = -1;
    car.pos = reduced() ? 0 : -1.6; car.target = 0; car.vel = 0;
    buildCards();
    engine.setVolume(ctl.vol);
    if (storedMute()) engine.setMuted(true);
    refreshVolume();
    setCurrent(0, false);
    if (engine.mode === "local") engine.load(0, false);
    $("badgeText").innerHTML = badgeHTML(items[0]);
    root.style.setProperty("--tint", items[0].tint);
    setAmbient(items[0].cover);
    anim(stage, [{ opacity: 0 }, { opacity: 1 }], { duration: 500, easing: "ease-out" });
    kick();
  }
  function useLocal(note) {
    $("ytFrame").hidden = true;
    var n = $("sourceNote"); n.textContent = note; n.hidden = false;
    useEngine(new LocalEngine(hooks));
  }

  setProgress(0);
  refreshVolume();
  if (!reduced()) {
    anim($("badge"), [{ opacity: 0, transform: "translateY(10px) scale(.94)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: 220, easing: SPRING, fill: "backwards" });
    anim(bar, [{ opacity: 0, translate: "0 40px" }, { opacity: 1, translate: "0 0" }], { duration: 800, delay: 120, easing: SPRING, fill: "backwards" });
  }
  if (ON_WEB) {
    $("ytFrame").hidden = false;
    var yt = new YouTubeEngine(hooks);
    ctl.engine = yt;   // so early mute/volume calls reach it
    yt.ready.then(function () { useEngine(yt); }, function () {
      yt.destroy();
      useLocal("YouTube couldn't be reached, so these are the site's local tracks.");
    });
  } else {
    useLocal("Opened from a file: YouTube only plays on the live site, so these are the site's local tracks.");
  }
})();
</script>
