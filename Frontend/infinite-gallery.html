<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Infinite Gallery — Animesh Hembram</title>
<meta name="description" content="An infinite 3D creative archive — an evolving space for UI/UX, design, tech, research and experiments." />
<meta name="theme-color" content="#1c1c1c" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/infinite-gallery.css" />
<!--
  Infinite Gallery.

  Completely standalone page: its own stylesheet (css/infinite-gallery.css)
  and its own scripts (js/infinite-gallery/*.js), loaded as plain classic
  <script> tags with zero build step — same convention as every other
  page in this portfolio, and specifically NOT `type="module"`, since
  Chrome blocks module-to-module imports when a page is opened via
  file:// (exactly how this portfolio is previewed locally). Each script
  attaches to a shared `window.InfiniteGallery` namespace instead of
  using import/export, and vendored Three.js attaches to `window.THREE`
  the same way. Nothing here touches AB2, about.html, the homepage,
  css/style.css, or js/dock.js (dock.js only gains one small, additive
  block elsewhere that links the existing Gallery dock button to this
  page).

  The interaction — infinite pan/zoom through a procedurally-placed field
  of media planes — is a hand-written vanilla Three.js port of the
  *behavior* of edoardolunardi/infinite-canvas (MIT, Codrops); see
  js/infinite-gallery/scene.js for the full explanation and credit.

  Content is real resource data: js/infinite-gallery/gallery-manifest.js
  is auto-generated by Backend/scripts/generate_gallery_manifest.py from
  whatever actually exists under Backend/resources/infinite gallery/ —
  see that script's header, and the README next to the resource folders,
  for the full workflow. There is no placeholder/test content in this
  page; an empty resource set renders an empty canvas.
-->
</head>
<body>

  <canvas id="infiniteGalleryCanvas" aria-label="Infinite Gallery — an interactive 3D space, drag or use WASD to explore"></canvas>

  <header class="ig-topbar">
    <a class="ig-topbar__home" href="index.html">&larr; Home</a>
    <span class="ig-topbar__title">Infinite Gallery</span>
  </header>

  <p class="ig-hint" id="igControlHint" aria-hidden="true"></p>

  <div class="ig-empty" id="igEmptyState" hidden aria-live="polite">
    <p>The gallery is empty right now.<br />Add resources to <code>Backend/resources/infinite gallery</code>, then run the manifest generator, to fill this space.</p>
  </div>

  <div class="ig-loader" id="igLoader">
    <div class="ig-loader__bar">
      <div class="ig-loader__fill" id="igLoaderFill"></div>
    </div>
  </div>

  <div class="ig-fallback" id="igFallback" hidden>
    <p>This experience needs WebGL, which isn&rsquo;t available right now.</p>
    <a href="index.html">&larr; Back to Home</a>
  </div>

  <noscript>
    <div class="ig-fallback">
      <p>The Infinite Gallery needs JavaScript enabled.</p>
      <a href="index.html">&larr; Back to Home</a>
    </div>
  </noscript>

  <!-- Load order matters: each file attaches to window.InfiniteGallery /
       window.THREE and reads whatever earlier scripts already attached.
       `defer` keeps this order while letting them download in parallel,
       and (like every other script in this portfolio) works identically
       whether the page is opened via file:// or a real server. -->
  <script src="js/vendor/three/three.global.js" defer></script>
  <script src="js/infinite-gallery/constants.js" defer></script>
  <script src="js/infinite-gallery/utils.js" defer></script>
  <script src="js/infinite-gallery/texture-manager.js" defer></script>
  <script src="js/infinite-gallery/scene.js" defer></script>
  <script src="js/infinite-gallery/gallery-manifest.js" defer></script>
  <script src="js/infinite-gallery/main.js" defer></script>
</body>
</html>
