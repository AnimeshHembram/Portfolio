<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Music — Animesh Hembram</title>
<meta name="description" content="Songs, original sounds, and an FM-style radio experience." />
<meta name="theme-color" content="#1c1c1c" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/music.css" />
<!--
  Music — PHASE 1: frontend only.

  Standalone page, own stylesheet (css/music.css) and own scripts
  (js/music/*.js), loaded as plain classic <script> tags — no build
  step, no framework, matching every other page in this portfolio and
  specifically NOT type="module" (see the Infinite Gallery's own notes
  on why: this portfolio is opened via file://, which blocks
  module-to-module imports).

  js/music/gooey-nav.js is a vanilla-JS port of a React "GooeyNav"
  component the user supplied — same visual design and particle
  animation, rewritten off React hooks/JSX the same way the Infinite
  Gallery's Three.js code was ported off React-Three-Fiber. Here it
  drives the in-page Songs / My Sounds / FM switcher below instead of
  real page navigation.

  Phase 1 scope only: this page establishes the three sections as UI
  shells the algorithm (Phase 2) and Backend resource system (Phase 3)
  will plug into later. No music-selection algorithm, no FM/location
  logic, and no Backend resources are wired up yet — see
  js/music/main.js. No commercial songs are embedded or downloaded.

  Nothing here touches AB2, the Infinite Gallery, the homepage, or any
  other page/script/stylesheet. The dock's existing "Music" icon
  (js/dock.js) gains one small, additive block linking it to this page
  — the same minimal pattern used for "About Me" and "Gallery".
-->
</head>
<body>

  <header class="mus-topbar">
    <a class="mus-topbar__home" href="index.html">&larr; Home</a>
    <div class="gooey-nav-container mus-topbar__nav" id="musicNav" role="tablist" aria-label="Music sections"></div>
  </header>

  <main class="mus-main">
    <div class="mus-panels">
      <section class="mus-panel" id="panel-songs" role="tabpanel" aria-labelledby="tab-songs">
        <!--
          Songs player — Phase 1 UI/mechanics only.

          Compact floating player, redesigned off the ChetanVerma
          reference (https://ui.chetanverma.com/components/audio-player
          — a React/Framer Motion/Tailwind component, reference only:
          adapted into plain HTML/CSS/vanilla JS, nothing installed or
          converted). Plain HTML5 <audio> driven by
          js/music/songs-player.js (window.Music.createSongsPlayer),
          same no-framework architecture as every other piece of this
          page. The markup below is static chrome (art, title/artist, a
          click/drag-to-seek progress bar, a five-button transport pill:
          shuffle/prev/play-pause/next/repeat); the script fills in the
          live values and wires up playback. No queue list — that
          belonged to the earlier wide-card design, now removed.

          songs-player.js takes a plain `songs` array of
          { title, artist, albumArt, audio } objects (see main.js's init
          call) — that shape is exactly what Backend/resources/music will
          hand it once Phase 2/3 wire up a real library and selection
          algorithm, so nothing here needs to change when that lands.
          The four tracks wired up now are temporary placeholders (same
          royalty-free demo songs the old CassettePlayer used, under
          assets/New folder/CassettePlayer/songs/), and the album art is
          a single placeholder SVG (assets/music/placeholder-cover.svg)
          since no real artwork exists yet.

          #playerBg is the artwork-reactive ambient background, adapted
          from the Groove Widget reference (Backend/resources/music/
          Groove-Widget-main — reference only, not copied wholesale): an
          oversized, blurred copy of the current track's own album art
          plus two large soft color glows (matching the reference's own
          full-page two-blob .app-bg, not one small centered glow), both
          driven entirely by js/music/songs-player.js off the same
          current-track state the player itself already uses (no
          separate "current background track" exists). It's fixed/
          full-viewport (see music.css for why — #panel-songs itself is
          only as wide as the player's own 640px content column, so
          anchoring to it trapped the effect in a visible rectangle) but
          stays a child of #panel-songs so hiding this panel (My Sounds/
          FM) hides it automatically, no main.js change needed. Two
          alternating __layer divs let the artwork crossfade between
          tracks instead of hard-cutting; .mus-player gets position:
          relative + z-index so it stays visually in front of it. The
          corner glows are kept at a low opacity even when no color was
          derived from the artwork (see music.css/songs-player.js),
          so the wash reads as continuous edge-to-edge instead of
          fading to the page's own dark base away from the player.
        -->
        <div class="mus-player-bg" id="playerBg" aria-hidden="true">
          <div class="mus-player-bg__layer" id="playerBgLayerA"></div>
          <div class="mus-player-bg__layer" id="playerBgLayerB"></div>
          <div class="mus-player-bg__glow mus-player-bg__glow--a" id="playerBgGlowA"></div>
          <div class="mus-player-bg__glow mus-player-bg__glow--b" id="playerBgGlowB"></div>
        </div>
        <div class="mus-player" id="songsPlayer">
          <div class="mus-player__art">
            <img class="mus-player__art-img" id="playerArtImg" src="" alt="" draggable="false" />
          </div>
          <div class="mus-player__meta">
            <p class="mus-player__title" id="playerTitle">&nbsp;</p>
            <p class="mus-player__artist" id="playerArtist">&nbsp;</p>
          </div>

          <div class="mus-player__progress">
            <div class="mus-player__seek" id="playerSeek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="mus-player__seek-fill" id="playerSeekFill"></div>
            </div>
            <div class="mus-player__times">
              <span class="mus-player__time" id="playerTimeCurrent">0:00</span>
              <span class="mus-player__time" id="playerTimeTotal">0:00</span>
            </div>
          </div>

          <div class="mus-player__controls">
            <div class="mus-player__controls-pill">
              <button type="button" class="mus-player__btn mus-player__btn--shuffle" id="playerShuffle" aria-label="Shuffle" aria-pressed="false"></button>
              <button type="button" class="mus-player__btn mus-player__btn--prev" id="playerPrev" aria-label="Previous track"></button>
              <button type="button" class="mus-player__btn mus-player__btn--play" id="playerPlayPause" aria-label="Play"></button>
              <button type="button" class="mus-player__btn mus-player__btn--next" id="playerNext" aria-label="Next track"></button>
              <button type="button" class="mus-player__btn mus-player__btn--repeat" id="playerRepeat" aria-label="Repeat" aria-pressed="false"></button>
            </div>
          </div>

          <audio id="playerAudio" preload="metadata"></audio>
        </div>
      </section>

      <section class="mus-panel" id="panel-my-sounds" role="tabpanel" aria-labelledby="tab-my-sounds" hidden>
        <div class="mus-empty">
          <p>Nothing here yet.</p>
          <p class="mus-empty__hint">Original songs, sound-design tracks and audio experiments will appear here once this section is connected to the Backend resource system in Phase 3.</p>
        </div>
      </section>

      <section class="mus-panel" id="panel-fm" role="tabpanel" aria-labelledby="tab-fm" hidden>
        <div class="mus-empty">
          <p>FM isn&rsquo;t tuned in yet.</p>
          <p class="mus-empty__hint">A location-based radio experience will be designed separately in Phase 2.</p>
        </div>
      </section>
    </div>
  </main>

  <script src="js/music/gooey-nav.js" defer></script>
  <script src="js/music/songs-player.js" defer></script>
  <script src="js/music/main.js" defer></script>
</body>
</html>
