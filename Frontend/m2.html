<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f6f8" />
    <meta name="description" content="A quiet digital listening room, built around a tactile turntable." />
    <title>Groove — Digital Turntable</title>
    <link rel="icon" type="image/svg+xml" href="assets/music/m2/groove-mark.svg" />
    <link rel="stylesheet" href="css/m2.css" />
    <link rel="stylesheet" href="css/m2-nav.css" />
    <link rel="stylesheet" href="css/m2-site-nav.css" />
    <!--
      M2 — standalone Groove turntable prototype.

      Built from the working Manus source in
      Backend/resources/music/groove. Plain HTML/CSS/JS, classic
      <script> (not type="module"), relative paths only, so it opens
      directly via file://.

      Deliberately independent of music.html, css/music.css,
      js/music/songs-player.js and js/dock.js. Not linked from anywhere.
      Audio is the prototype's own Web Audio synth — no music library,
      Songs algorithm, FM or My Sounds here.

      2026-10-05 — the Music page's top navbar was added (the <header>
      below): same markup as music.html, styled by css/m2-nav.css and
      driven by the existing js/music/gooey-nav.js, started by
      js/music/m2-nav.js. Only the navbar: no panels, no Songs player.

      2026-10-08 — in that navbar, the GooeyNav "Songs | My Sounds | FM"
      bar was replaced by the A / H / X letter control
      (css/music-letter-nav.css + js/music/letter-nav.js, shared with
      music.html and the Radio page). Home is unchanged. Menu, in
      alphabetical order: My Sounds, Radio (the FM item), Songs. What each
      one does is unchanged and still lives in js/music/m2-nav.js. The
      turntable is not touched.

      2026-10-08 (later) — on this page only, the letter control moved to
      the top-left corner, at the same position and size as the AB2 About
      page's control (the "mus-lnav--corner" modifier in
      css/music-letter-nav.css), and the "← Home" pill was removed: the
      control replaces it. music.html and the Radio page are unchanged.

      2026-10-08 (latest) — the control is the portfolio's GLOBAL
      navigation, the same one as on the AB2 About page, and no longer a
      Music-section menu. Menu: Home, Gallery, Music, Projects, Resume,
      Switch — minus "Music", removed at the user's request because this
      IS the Music page. The <nav> below is otherwise AB2's markup; it is driven by
      AB2's own script (js/ab2/nav.js, unmodified) and styled by
      css/m2-site-nav.css (AB2's navigation rules plus M2's placement).
      This supersedes the two notes above: css/music-letter-nav.css,
      js/music/letter-nav.js and js/music/m2-nav.js are no longer loaded
      here. Songs / My Sounds / Radio are Music sections and are not part
      of this menu; js/music/m2-nav.js is kept on disk for when they get
      their own navigation.

      2026-10-08 (secondary navigation restored) — two navigations now:
        top-left   the global A / H / X control (above), unchanged;
        top-centre the Music section tabs, restored: the original GooeyNav
                   (js/music/gooey-nav.js, started by js/music/m2-nav.js,
                   styled by css/m2-nav.css — all as before the letter
                   control), with the visible labels Songs / My Music /
                   Radio. Songs is this page, My Music has nothing behind
                   it yet, Radio opens Radio/radio.html.
      css/m2-site-nav.css keeps the two apart on phones.
    -->
  </head>
  <body>
    <header class="mus-topbar">
      <nav class="ab2-nav" id="ab2-nav" aria-label="Site navigation">
        <button class="ab2-nav__btn" type="button" id="ab2-nav-btn"
                aria-label="Open navigation" aria-expanded="false" aria-controls="ab2-nav-menu">
          <span class="ab2-nav__glyph" aria-hidden="true">
            <span class="ab2-nav__bar ab2-nav__bar--l"></span>
            <span class="ab2-nav__bar ab2-nav__bar--r"></span>
            <span class="ab2-nav__bar ab2-nav__bar--c"></span>
          </span>
        </button>
        <ul class="ab2-nav__menu" id="ab2-nav-menu">
          <li><a class="ab2-nav__item" href="index.html">Home</a></li>
          <li><a class="ab2-nav__item" href="infinite-gallery.html">Gallery</a></li>
          <li><span class="ab2-nav__item ab2-nav__item--off" aria-disabled="true">Projects</span></li>
          <li><span class="ab2-nav__item ab2-nav__item--off" aria-disabled="true">Resume</span></li>
          <li><span class="ab2-nav__item ab2-nav__item--off" aria-disabled="true">Switch</span></li>
        </ul>
      </nav>
      <div class="gooey-nav-container mus-topbar__nav" id="musicNav" role="tablist" aria-label="Music navigation sections"></div>
    </header>
    <main class="listening-room">
      <section class="stage" aria-label="Interactive digital turntable">
        <groove-turntable artwork="assets/music/m2/record-artwork.png" volume="72"></groove-turntable>
      </section>
      <footer class="colophon" aria-hidden="true"></footer>
    </main>
    <script src="js/music/m2-turntable.js" defer></script>
    <script src="js/music/gooey-nav.js" defer></script>
    <script src="js/music/m2-nav.js" defer></script>
    <script src="js/ab2/nav.js" defer></script>
  </body>
</html>
