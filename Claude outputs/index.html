<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animesh Hembram — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- LOADING PAGE — always plays first, then dissolves into the landing page beneath it -->
  <div id="loader" class="loader" role="status" aria-label="Loading">
    <div class="wave-loader" aria-hidden="true"></div>
  </div>

  <!-- LANDING PAGE — hero fades in once the loader clears -->
  <main id="landing" class="landing">
    <section class="hero" style="background-image: url('assets/images/hero-workspace.webp');">
      <div class="hero-overlay"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
