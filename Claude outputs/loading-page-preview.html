<title>Portfolio Loader</title>
<style>
  :root {
    --paper: #ffffff;
    --ink: #0a0a0a;
    --muted: #8a8477;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }

  body.is-loading { overflow: hidden; height: 100vh; }

  .loader {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wave-loader {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: inline-grid;
    padding: 5px;
    background: var(--paper);
    filter: blur(4px) contrast(12);
  }
  .wave-loader:before,
  .wave-loader:after {
    content: "";
    grid-area: 1/1;
    height: 40px;
    aspect-ratio: 3;
    --c: #0000 64%, #000 66% 98%, #0000 101%;
    background:
      radial-gradient(35% 146% at 50% 159%, var(--c)) 0 0,
      radial-gradient(35% 146% at 50% -59%, var(--c)) 100% 100%;
    background-size: calc(200% / 3) 50%;
    background-repeat: repeat-x;
  }
  .wave-loader:before {
    -webkit-mask: repeating-linear-gradient(90deg, #000 0 8%, #0000 0 15%);
    mask: repeating-linear-gradient(90deg, #000 0 8%, #0000 0 15%);
  }
  .wave-loader:after {
    clip-path: inset(0 100% 0 0);
    animation: waveLoad 1.5s infinite linear;
  }
  @keyframes waveLoad {
    50% { clip-path: inset(0); }
    to { clip-path: inset(0 0 0 100%); }
  }

  .replay {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 200;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 999px;
    padding: 0.6rem 1.1rem;
    cursor: pointer;
  }
  .replay:hover { background: var(--ink); color: var(--paper); }
  .replay:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .landing {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vh 6vw;
  }

  .hero .eyebrow {
    font-size: clamp(0.7rem, 1vw, 0.95rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 1.5rem;
  }

  .hero-title {
    font-size: clamp(3rem, 9vw, 8rem);
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: -0.03em;
    margin: 0;
    text-wrap: balance;
  }

  .hero-sub {
    margin: 1.5rem 0 0;
    font-size: clamp(0.9rem, 1.2vw, 1.1rem);
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .loader { transition: none !important; }
    .wave-loader:after { animation: none !important; clip-path: inset(0); }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

<button class="replay" id="replay" type="button">Replay</button>

<div id="loader" class="loader" role="status" aria-label="Loading">
  <div class="wave-loader" aria-hidden="true"></div>
</div>

<main id="landing" class="landing">
  <section class="hero">
    <p class="eyebrow">Creative Strategist — Filmmaker — Music Producer</p>
    <h1 class="hero-title">ANIMESH<br />HEMBRAM</h1>
    <p class="hero-sub">Portfolio — under construction</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  (function () {
    const loader = document.getElementById("loader");
    const replayBtn = document.getElementById("replay");

    const HOLD_DURATION = 1.6;
    const FADE_DURATION = 0.9;

    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let holdTimer = null;

    function fadeOut() {
      if (typeof gsap !== "undefined") {
        gsap.to(loader, {
          opacity: 0,
          duration: FADE_DURATION,
          ease: "power2.inOut",
          onComplete: () => {
            loader.style.display = "none";
            document.body.classList.remove("is-loading");
          },
        });
      } else {
        loader.style.transition = `opacity ${FADE_DURATION}s ease-in-out`;
        loader.style.opacity = 0;
        setTimeout(() => {
          loader.style.display = "none";
          document.body.classList.remove("is-loading");
        }, FADE_DURATION * 1000);
      }
    }

    function play() {
      clearTimeout(holdTimer);
      loader.style.display = "flex";
      loader.style.opacity = 1;
      document.body.classList.add("is-loading");

      if (prefersReducedMotion) {
        loader.style.display = "none";
        document.body.classList.remove("is-loading");
        return;
      }

      holdTimer = setTimeout(fadeOut, HOLD_DURATION * 1000);
    }

    replayBtn.addEventListener("click", play);

    document.fonts.ready.then(play);
  })();
</script>
